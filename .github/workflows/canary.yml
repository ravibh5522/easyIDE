name: Canary

# Every push to main produces an installable APK at a stable URL:
#   https://github.com/ravibh5522/easyIDE/releases/download/canary/easyIDE-canary.apk
# The canary uses applicationId dev.easyide.app.canary, so it installs
# alongside a stable build rather than replacing it.

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/canary.yml'
  workflow_dispatch:

concurrency:
  group: canary
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # terminal-emulator pins this NDK; the runner image does not carry it.
      - name: Install pinned NDK
        run: |
          NDK_VERSION=$(grep -oP 'ndkVersion = "\K[^"]+' services/mobile/terminal-emulator/build.gradle.kts)
          echo "Installing NDK $NDK_VERSION"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/easyide.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret set - the APK will be DEBUG-SIGNED." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build canary APK
        working-directory: services/mobile
        env:
          EASYIDE_BUILD_NUMBER: ${{ github.run_number }}
          EASYIDE_GIT_SHA: ${{ github.sha }}
          EASYIDE_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/easyide.jks', runner.temp) || '' }}
          EASYIDE_KEYSTORE_PASSWORD: ${{ secrets.EASYIDE_KEYSTORE_PASSWORD }}
          EASYIDE_KEY_ALIAS: ${{ secrets.EASYIDE_KEY_ALIAS }}
          EASYIDE_KEY_PASSWORD: ${{ secrets.EASYIDE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleCanary --no-daemon

      - name: Stage release assets
        id: assets
        run: |
          mkdir -p dist
          APK=$(find services/mobile/app/build/outputs/apk/canary -name '*.apk' | head -1)
          cp "$APK" dist/easyIDE-canary.apk
          # Distributing the APK distributes GPL-2.0 PRoot and LGPL-3.0 talloc.
          # NOTICE.md carries the attribution and the written offer of source.
          cp LICENSE NOTICE.md dist/
          sha256sum dist/easyIDE-canary.apk | cut -d' ' -f1 > dist/easyIDE-canary.apk.sha256
          {
            echo "size=$(( $(stat -c%s dist/easyIDE-canary.apk) / 1048576 ))"
            echo "sha=$(cat dist/easyIDE-canary.apk.sha256)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish rolling canary release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          NOTES=$(cat <<EOF
          Rolling canary build of \`main\`. Overwritten on every push -- not a stable release.

          | | |
          |---|---|
          | Commit | [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | Build | ${GITHUB_RUN_NUMBER} |
          | Size | ${{ steps.assets.outputs.size }} MB |
          | SHA-256 | \`${{ steps.assets.outputs.sha }}\` |
          | Signing | $([ "$SIGNED" = "true" ] && echo "release key" || echo "**debug key** -- cannot be upgraded to a stable build, uninstall first") |

          Installs as **easyIDE Canary** (\`dev.easyide.app.canary\`) alongside a stable build.

          This APK bundles PRoot (GPL-2.0-or-later) and talloc (LGPL-3.0-or-later).
          See the attached \`NOTICE.md\` for attribution and how to obtain their source.
          EOF
          )
          if gh release view canary >/dev/null 2>&1; then
            gh release edit canary --target "$GITHUB_SHA" --title "Canary" --notes "$NOTES" --prerelease
          else
            gh release create canary --target "$GITHUB_SHA" --title "Canary" --notes "$NOTES" --prerelease
          fi
          gh release upload canary dist/* --clobber
