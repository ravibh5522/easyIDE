name: Release

# Tag a commit to cut a stable build:
#   git tag v0.2.0 && git push origin v0.2.0
# Produces dev.easyide.app -- the same applicationId a user already has
# installed, so it upgrades in place (provided both are signed with the
# same key).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK
        run: |
          NDK_VERSION=$(grep -oP 'ndkVersion = "\K[^"]+' services/mobile/terminal-emulator/build.gradle.kts)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYIDE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/easyide.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No keystore secret set - this release will be DEBUG-SIGNED and cannot be upgraded later."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: services/mobile
        env:
          EASYIDE_BUILD_NUMBER: ${{ github.run_number }}
          EASYIDE_GIT_SHA: ${{ github.sha }}
          EASYIDE_KEYSTORE_FILE: ${{ steps.signing.outputs.signed == 'true' && format('{0}/easyide.jks', runner.temp) || '' }}
          EASYIDE_KEYSTORE_PASSWORD: ${{ secrets.EASYIDE_KEYSTORE_PASSWORD }}
          EASYIDE_KEY_ALIAS: ${{ secrets.EASYIDE_KEY_ALIAS }}
          EASYIDE_KEY_PASSWORD: ${{ secrets.EASYIDE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage release assets
        id: assets
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          APK=$(find services/mobile/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "dist/easyIDE-${TAG}.apk"
          cp LICENSE NOTICE.md dist/
          sha256sum "dist/easyIDE-${TAG}.apk" | cut -d' ' -f1 > "dist/easyIDE-${TAG}.apk.sha256"
          {
            echo "tag=$TAG"
            echo "size=$(( $(stat -c%s "dist/easyIDE-${TAG}.apk") / 1048576 ))"
            echo "sha=$(cat "dist/easyIDE-${TAG}.apk.sha256")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          NOTES=$(cat <<EOF
          | | |
          |---|---|
          | Size | ${{ steps.assets.outputs.size }} MB |
          | SHA-256 | \`${{ steps.assets.outputs.sha }}\` |
          | Min Android | 8.0 (API 26) |
          | ABIs | arm64-v8a, x86_64 |
          | Signing | $([ "$SIGNED" = "true" ] && echo "release key" || echo "**debug key** -- not upgradeable, uninstall before installing a properly signed build") |

          easyIDE is source-available: free for personal and noncommercial use under the
          [PolyForm Noncommercial License](LICENSE); commercial use requires a
          [paid licence](LICENSE-COMMERCIAL.md).

          This APK bundles PRoot (GPL-2.0-or-later) and talloc (LGPL-3.0-or-later).
          The attached \`NOTICE.md\` carries the attribution and how to obtain their source.
          EOF
          )
          gh release create "${{ steps.assets.outputs.tag }}" \
            --title "easyIDE ${{ steps.assets.outputs.tag }}" \
            --notes "$NOTES" \
            --generate-notes \
            dist/*
