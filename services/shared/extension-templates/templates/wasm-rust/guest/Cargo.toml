[package]
name = "{{name}}"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Vendored copy of the easyIDE guest bindings (Apache-2.0); see easyide-guest/README.md.
easyide-guest = { path = "easyide-guest" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
