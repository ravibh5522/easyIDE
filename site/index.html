<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>easyIDE - a real IDE for Android tablets</title>
<meta name="description" content="Native editor, file tree and an Ubuntu terminal on your Android tablet. On-device, offline, no root.">
<link rel="icon" href="icon.png">
<style>
:root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --accent:#ff8a3d; --card:#181b21; }
@media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,sans-serif; }
main { max-width:720px; margin:0 auto; padding:64px 16px; text-align:center; }
img { width:128px; height:128px; border-radius:24px; }
h1 { font-size:2.4rem; margin:16px 0 8px; }
p { color:var(--muted); }
.btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:32px 0; }
a.btn { padding:12px 24px; border-radius:8px; background:var(--accent); color:#111; font-weight:600; text-decoration:none; }
a.btn.alt { background:var(--card); color:var(--fg); }
ul { list-style:none; padding:0; text-align:left; background:var(--card); border-radius:12px; padding:16px 24px; }
</style>
</head>
<body>
<main>
<img src="icon.png" alt="easyIDE icon">
<h1>easyIDE</h1>
<p>A real IDE with a real Linux userland, for Android tablets.</p>
<div class="btns">
<a class="btn" href="https://github.com/ravibh5522/easyIDE/releases/latest">Download</a>
<a class="btn alt" href="https://github.com/ravibh5522/easyIDE">Source on GitHub</a>
<a class="btn alt" href="https://t.me/+yMH4w5rX1gZhOTM1">Telegram</a>
</div>
<ul>
<li>Native editor and file tree</li>
<li>Ubuntu terminal, on the device, no root</li>
<li>Git and Claude Code CLI built in</li>
<li>Works offline. Android 8.0+, arm64 and x86_64</li>
</ul>
<p>Beta software, AGPL-3.0.</p>
</main>
</body>
</html>
